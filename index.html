<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baiyoke Sky F&B Operations Hub</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--text:#18212f;--muted:#6b7280;--line:#e6eaf0;
  --brand:#0b6fa4;--brand2:#1b9bd1;--soft:#eaf6fb;--danger:#c53d3d;--ok:#258a55;
  --shadow:0 10px 30px rgba(25,45,70,.08);--r:18px
}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Tahoma,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.top{background:linear-gradient(135deg,#ffffff,#eef8fc);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.nav{max-width:1180px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{display:flex;align-items:center;gap:12px;font-weight:800}.logoMark{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#74c7e8,#1476a8);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:var(--shadow)}
.nav small{display:block;color:var(--muted);font-weight:500}.navActions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.ghost{background:transparent}.btn.danger{color:#a82e2e}
.wrap{max-width:1180px;margin:0 auto;padding:26px 20px 50px}
.login{min-height:82vh;display:grid;place-items:center;padding:30px}
.loginCard{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:34px}
.loginCard h1{margin:0 0 5px}.loginCard p{color:var(--muted);margin-top:0}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dce2e9;border-radius:11px;outline:none;background:#fff}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px #dff3fb}
.demo{background:#f8fafc;border:1px dashed #cbd5e1;padding:12px;border-radius:12px;margin-top:14px;font-size:13px}
.hidden{display:none!important}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.hero h1{margin:0;font-size:30px}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:var(--soft);color:var(--brand);font-size:12px;font-weight:800}
.announce{background:#fff;border:1px solid var(--line);border-left:5px solid var(--brand2);border-radius:15px;padding:15px 17px;margin-bottom:22px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow);transition:.15s}.card:hover{transform:translateY(-2px);border-color:#cbdfe9}.card .icon{font-size:28px}.card h3{margin:12px 0 5px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.card button{margin-top:15px;width:100%}
.section{margin-top:28px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionHead h2{margin:0;font-size:19px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.stat b{font-size:25px;display:block}.stat span{color:var(--muted);font-size:12px}
.admin{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted);font-size:12px}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.toolbar{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #d5dce5;border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px;z-index:50}.modalBox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead h2{margin:0}.notice{padding:12px 14px;background:#f8fafc;border-radius:12px;margin:10px 0}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:35px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.nav{padding:12px}.wrap{padding:18px 14px 40px}.hero{display:block}.grid,.stats{grid-template-columns:1fr}.navActions .desktop{display:none}.formGrid{grid-template-columns:1fr}.login{padding:15px}.loginCard{padding:24px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const KEY="baiyoke_fnb_phase23";
const defaults={
  users:[
    {id:"ADMIN001",name:"Baiyoke Admin",role:"Admin",outlet:"All",pin:"1234"},
    {id:"MGR001",name:"F&B Manager",role:"F&B Manager",outlet:"All",pin:"1234"},
    {id:"SUP76",name:"Supervisor 76F",role:"Supervisor",outlet:"76F",pin:"1234"},
    {id:"SUP78",name:"Supervisor 78F",role:"Supervisor",outlet:"78F",pin:"1234"},
    {id:"INSPECT001",name:"Inspector",role:"Inspector",outlet:"All",pin:"1234"}
  ],
  outlets:[
    {code:"76F",name:"Restaurant 76F",status:"เปิด"},
    {code:"78F",name:"Restaurant 78F",status:"เปิด"},
    {code:"BYSKY",name:"Baiyoke Sky F&B",status:"เปิด"}
  ],
  announcements:[{title:"ยินดีต้อนรับสู่ Baiyoke F&B Operations Hub",detail:"ระบบต้นแบบยึดโครงสร้างการใช้งานแบบ FAB: Hub, Team Management, ระบบประกาศ และเครื่องมือผู้ดูแล",date:"วันนี้"}]
};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch(e){return structuredClone(defaults)}}
let db=load(), current=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function renderLogin(){
 document.getElementById("app").innerHTML=`<div class="login">
  <div class="loginCard">
   <div class="logo"><div class="logoMark">B</div><div>Baiyoke Sky F&B<small>Operations Hub</small></div></div>
   <h1 style="margin-top:25px">เข้าสู่ระบบ</h1><p>ระบบงานปฏิบัติการและฝึกอบรม</p>
   <div class="field"><label>รหัสพนักงาน</label><input id="uid" inputmode="text" placeholder="เช่น ADMIN001"></div>
   <div class="field"><label>รหัสผ่าน / PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="กรอกรหัสผ่าน"></div>
   <button class="btn primary" style="width:100%;padding:12px" onclick="login()">เข้าสู่ Operations Hub</button>
   <div class="demo"><b>Demo สำหรับทดสอบ</b><br>ADMIN001 / 1234 · MGR001 / 1234 · SUP76 / 1234 · SUP78 / 1234 · INSPECT001 / 1234</div>
  </div></div>`;
}
function login(){
 const id=document.getElementById("uid").value.trim().toUpperCase(), pin=document.getElementById("pin").value.trim();
 const u=db.users.find(x=>x.id===id&&x.pin===pin);
 if(!u)return alert("รหัสพนักงานหรือ PIN ไม่ถูกต้อง");
 current=u; renderHub();
}
function header(){
 return `<div class="top"><div class="nav"><div class="logo"><div class="logoMark">B</div><div>Baiyoke Sky F&B<small>Operations Hub</small></div></div>
 <div class="navActions"><span class="badge desktop">${esc(current.role)} · ${esc(current.id)}</span><button class="btn" onclick="renderHub()">Hub</button><button class="btn danger" onclick="logout()">ออกจากระบบ</button></div></div></div>`;
}
function logout(){current=null;renderLogin()}
function canAdmin(){return current?.role==="Admin"}
const cards=[
 ["📋","Checklist","ตรวจมาตรฐานงานประจำวันและบันทึกผล","checklist"],
 ["🚨","Incident","แจ้งเหตุผิดปกติ / Food Safety / Service","incident"],
 ["📝","Complaint","บันทึกและติดตามข้อร้องเรียน","complaint"],
 ["✅","Approval","รายการที่ต้องตรวจและอนุมัติ","approval"],
 ["🔔","Notifications","ประกาศและการแจ้งเตือนจากส่วนกลาง","alerts"],
 ["📊","Dashboard","ภาพรวมผลการปฏิบัติงาน","dashboard"],
 ["📈","Executive Master","สรุปสำหรับผู้บริหาร","executive"],
 ["⚙️","Admin Tools","Users, Outlets, Announcements และสิทธิ์","admin"]
];
function renderHub(){
 const visible=cards.filter(c=>c[3]!=="admin"||canAdmin());
 document.getElementById("app").innerHTML=header()+`<main class="wrap">
 <div class="hero"><div><span class="badge">Baiyoke Sky Hotel · F&B</span><h1>Operations & Training Hub</h1><p class="muted">ระบบงานปฏิบัติการและฝึกอบรมสำหรับงานอาหารและเครื่องดื่ม</p></div><button class="btn primary" onclick="openAnnouncement()">📢 ดูประกาศ</button></div>
 ${db.announcements.length?`<div class="announce"><b>📢 ${esc(db.announcements[0].title)}</b><div class="muted" style="margin-top:5px">${esc(db.announcements[0].detail)}</div></div>`:""}
 <div class="stats"><div class="stat"><b>${db.outlets.length}</b><span>พื้นที่/Outlet</span></div><div class="stat"><b>${db.users.length}</b><span>ผู้ใช้งาน</span></div><div class="stat"><b>0</b><span>Open Incidents</span></div><div class="stat"><b>0</b><span>Pending Approval</span></div></div>
 <section class="section"><div class="sectionHead"><h2>เมนูระบบ</h2><span class="muted">เลือกเมนูเพื่อเข้าใช้งาน</span></div><div class="grid">${visible.map(c=>`<div class="card"><div class="icon">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p><button class="btn primary" onclick="openModule('${c[3]}')">เปิดระบบ</button></div>`).join("")}</div></section>
 <footer>© 2026 Baiyoke Sky F&B Operations Hub · Prototype Phase 23 · Inspired by FAB Operations & Training Hub</footer></main>`;
}
function openModule(m){
 if(m==="admin")return renderAdmin();
 const titles={checklist:"Checklist",incident:"Incident Report",complaint:"Complaint Management",approval:"Approval Queue",alerts:"Notifications",dashboard:"Dashboard",executive:"Executive Master"};
 const desc={checklist:"บันทึก Checklist แยกตาม Outlet และรอบงาน",incident:"บันทึกเหตุการณ์พร้อมระดับความรุนแรงและผู้รับผิดชอบ",complaint:"บันทึกข้อร้องเรียนและสถานะการแก้ไข",approval:"ตรวจรายการที่รออนุมัติ",alerts:"ประกาศและข้อความจากส่วนกลาง",dashboard:"ดู KPI และสถานะการดำเนินงาน",executive:"สรุปภาพรวมสำหรับผู้บริหาร"};
 document.getElementById("app").innerHTML=header()+`<main class="wrap"><button class="btn" onclick="renderHub()">← กลับ Hub</button><div class="hero" style="margin-top:18px"><div><h1>${titles[m]}</h1><p class="muted">${desc[m]}</p></div><span class="badge">Prototype UI พร้อมต่อ Backend</span></div>
 <div class="admin"><div class="notice"><b>${titles[m]}</b><br><span class="muted">โครงสร้างหน้านี้จัดไว้ให้ต่อระบบจริงภายหลัง โดยยังไม่แกล้งทำว่าเชื่อมฐานข้อมูลแล้ว</span></div>
 ${m==="checklist"?checklistUI():genericUI(m)}</div></main>`;
}
function checklistUI(){return `<div class="formGrid"><div class="field"><label>Outlet</label><select><option>76F</option><option>78F</option><option>All F&B</option></select></div><div class="field"><label>รอบตรวจ</label><select><option>Opening</option><option>Mid Shift</option><option>Closing</option></select></div></div><table class="table"><tr><th>รายการตรวจ</th><th>ผล</th><th>หมายเหตุ</th></tr><tr><td>ความสะอาดพื้นที่บริการ</td><td><select><option>PASS</option><option>FAIL</option></select></td><td><input placeholder="หมายเหตุ"></td></tr><tr><td>อุณหภูมิอาหาร/ตู้เย็น</td><td><select><option>PASS</option><option>FAIL</option></select></td><td><input placeholder="หมายเหตุ"></td></tr><tr><td>มาตรฐาน Service</td><td><select><option>PASS</option><option>FAIL</option></select></td><td><input placeholder="หมายเหตุ"></td></tr></table><div class="toolbar"><button class="btn" onclick="renderHub()">ยกเลิก</button><button class="btn primary" onclick="alert('บันทึกแบบ Prototype สำเร็จ')">บันทึก Checklist</button></div>`}
function genericUI(m){return `<div class="empty">หน้านี้พร้อมเป็นโครงสร้างการทำงานแล้ว<br><br><button class="btn primary" onclick="alert('เปิดฟอร์ม Prototype')">สร้างรายการใหม่</button></div>`}
function openAnnouncement(){document.getElementById("app").insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="modalBox"><div class="modalHead"><h2>📢 ประกาศ</h2><button class="btn" onclick="closeModal()">ปิด</button></div>${db.announcements.map(a=>`<div class="notice"><b>${esc(a.title)}</b><p>${esc(a.detail)}</p><small>${esc(a.date)}</small></div>`).join("")}</div></div>`)}
function closeModal(){document.getElementById("modal")?.remove()}
function renderAdmin(){
 document.getElementById("app").innerHTML=header()+`<main class="wrap"><button class="btn" onclick="renderHub()">← กลับ Hub</button><div class="hero" style="margin-top:18px"><div><h1>เครื่องมือผู้ดูแลระบบ</h1><p class="muted">จัดการผู้ใช้, สาขา/Outlet, ประกาศ และสิทธิ์ในจุดเดียว</p></div></div>
 <div class="admin"><div class="tabs"><button class="btn active" onclick="adminTab('users',this)">👥 Users</button><button class="btn" onclick="adminTab('outlets',this)">🏨 Outlets</button><button class="btn" onclick="adminTab('announce',this)">📢 Announcements</button><button class="btn" onclick="adminTab('systems',this)">⚙️ Systems</button></div><div id="adminBody"></div></div></main>`;
 adminTab("users",document.querySelector(".tabs button"));
}
function adminTab(tab,btn){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");const b=document.getElementById("adminBody");
 if(tab==="users")b.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="addUser()">+ เพิ่มผู้ใช้</button></div><table class="table"><tr><th>รหัส</th><th>ชื่อ</th><th>ตำแหน่ง</th><th>Outlet</th><th></th></tr>${db.users.map((u,i)=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${esc(u.outlet)}</td><td><button class="btn danger" onclick="delUser(${i})">ลบ</button></td></tr>`).join("")}</table>`;
 if(tab==="outlets")b.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="addOutlet()">+ เพิ่ม Outlet</button></div><table class="table"><tr><th>รหัส</th><th>ชื่อ</th><th>สถานะ</th><th></th></tr>${db.outlets.map((o,i)=>`<tr><td>${esc(o.code)}</td><td>${esc(o.name)}</td><td>${esc(o.status)}</td><td><button class="btn danger" onclick="delOutlet(${i})">ลบ</button></td></tr>`).join("")}</table>`;
 if(tab==="announce")b.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="addAnnouncement()">+ เพิ่มประกาศ</button></div>${db.announcements.map((a,i)=>`<div class="notice"><b>${esc(a.title)}</b><div>${esc(a.detail)}</div><button class="btn danger" style="margin-top:8px" onclick="delAnnouncement(${i})">ลบ</button></div>`).join("")}`;
 if(tab==="systems")b.innerHTML=`<div class="notice"><b>สิทธิ์ระบบ</b><br>Admin เห็นทุกระบบ · Manager เห็นงาน F&B · Supervisor เห็นตาม Outlet · Inspector เห็นงานตรวจ</div><div class="notice"><b>สถานะการเชื่อมต่อ</b><br>Frontend: <span style="color:var(--ok)">พร้อมใช้งาน</span><br>Backend/Database: ยังไม่เชื่อม (ตามจริง)</div>`;
}
function addUser(){const id=prompt("รหัสพนักงาน");if(!id)return;const name=prompt("ชื่อ");if(!name)return;const role=prompt("ตำแหน่ง","Supervisor")||"Supervisor";const outlet=prompt("Outlet","76F")||"All";const pin=prompt("PIN","1234")||"1234";db.users.push({id:id.toUpperCase(),name,role,outlet,pin});save();renderAdmin()}
function delUser(i){if(db.users[i].id==="ADMIN001")return alert("ลบ Admin หลักไม่ได้");if(confirm("ลบผู้ใช้นี้?")){db.users.splice(i,1);save();renderAdmin()}}
function addOutlet(){const code=prompt("รหัส Outlet");if(!code)return;const name=prompt("ชื่อ Outlet");if(!name)return;db.outlets.push({code,name,status:"เปิด"});save();renderAdmin()}
function delOutlet(i){if(confirm("ลบ Outlet นี้?")){db.outlets.splice(i,1);save();renderAdmin()}}
function addAnnouncement(){const title=prompt("หัวเรื่อง");if(!title)return;const detail=prompt("รายละเอียด","ประกาศจากส่วนกลาง");db.announcements.unshift({title,detail,date:new Date().toLocaleDateString("th-TH")});save();renderAdmin()}
function delAnnouncement(i){db.announcements.splice(i,1);save();renderAdmin()}
renderLogin();
</script>
</body></html>
